[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kbpad"
version = "0.2.0"
description = "Use keyboards as virtual Xbox 360 controllers for PCSX2 and other games (GUI)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
dependencies = [
    "evdev>=1.7",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = []

[project.scripts]
kbpad = "kbpad.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kbpad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["uinput: needs a writable /dev/uinput (skipped otherwise)"]
